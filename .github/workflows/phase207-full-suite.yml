name: Phase 207 full repository regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "core/execution/historical_capture_orchestrator.py"
      - "core/execution/cross_capture_reconciliation.py"
      - "tests/test_phase207_durable_capture_resume.py"
      - "BUILD_MANIFEST.sha256"
      - "IMPLEMENTATION_STATE.md"
      - ".github/workflows/phase207-full-suite.yml"

permissions:
  contents: read

concurrency:
  group: phase207-full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --verify --strict
      - name: Run full repository test suite
        run: python -m pytest tests -q -p no:cacheprovider --no-header
