name: Paper data gate regression (Phase 208)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-data-gate:
    name: Paper data gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Preserve canonical Git blob bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --root . --verify --strict
      - name: Certify normalized market data and paper entrypoint gates
        run: python -m pytest tests/test_phase203_market_data_validation.py tests/test_phase204_paper_data_quality_gate.py tests/test_phase205_paper_runtime_quality_gate.py tests/test_phase206_all_paper_entrypoint_gates.py tests/test_phase207_realtime_orchestrator_gate_config.py tests/test_phase208_canonical_realtime_gate.py -q
