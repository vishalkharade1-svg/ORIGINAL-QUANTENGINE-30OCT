name: Canonical merge gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-merge-gate:
    name: canonical-merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install canonical pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --root . --verify --strict

      - name: Run repository secret scan
        run: |
          python scripts/security/scan_secrets.py
          python scripts/security/scan_secrets.py --check-staged

      - name: Run canonical safety and evidence regression set
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest -q \
            tests/test_secret_scan_phase0.py \
            tests/test_secret_scan_phase193b.py \
            tests/test_live_block_11.py \
            tests/test_safety_guards_11a.py \
            tests/test_order_executor.py \
            tests/test_phase193a_execution_safety_gate.py \
            tests/test_phase193b_authority.py \
            tests/test_phase189_authorization_preflight.py \
            tests/test_phase206_historical_capture_pipeline.py \
            tests/test_phase207_durable_capture_resume.py \
            tests/test_phase199_delta_reconciliation_read_adapter.py \
            tests/test_phase205_cross_capture_reconciliation.py
