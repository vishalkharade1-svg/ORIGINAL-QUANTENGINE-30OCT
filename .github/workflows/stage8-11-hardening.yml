name: Stage 8–11 production hardening evidence gates

on:
  pull_request:
    branches: [main, production-hardening/stages-4-7]
    paths:
      - "core/governance/production_hardening.py"
      - "tests/test_production_hardening_stages8_11.py"
      - "docs/production_hardening_stages8_11.md"
      - "BUILD_MANIFEST.sha256"
      - ".github/workflows/stage8-11-hardening.yml"

permissions:
  contents: read

concurrency:
  group: stage8-11-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage8-11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest==9.0.3
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --verify --strict
      - name: Stage 8–11 evidence-gate tests
        run: python -m pytest -q tests/test_production_hardening_stages8_11.py
