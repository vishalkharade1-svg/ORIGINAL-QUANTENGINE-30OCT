name: Phase 206 historical capture tests

on:
  push:
    branches:
      - phase206/bounded-multi-window-capture
      - phase207/mainline-durable-capture
      - main
      - audit/deep-hardening-2026-11-10
      - audit/deep-hardening-clean-2026-11-10
  pull_request:
    branches:
      - main
    paths:
      - "core/execution/historical_capture_orchestrator.py"
      - "core/exchanges/delta/reconciliation_read_adapter.py"
      - "tests/test_phase206_historical_capture_pipeline.py"
      - "tests/test_phase207_durable_capture_resume.py"
      - "scripts/security/scan_secrets.py"
      - "tests/test_secret_scan_phase0.py"
      - "tests/test_secret_scan_phase193b.py"
      - "core/execution/live_safety_gate.py"
      - "core/execution/order_executor.py"
      - "core/exchanges/delta/delta_exchange.py"
      - "core/exchanges/delta/write_authority.py"
      - "core/execution/testnet_authorization_gate.py"
      - "tests/test_phase193a_execution_safety_gate.py"
      - "tests/test_live_block_11.py"
      - ".github/workflows/phase206-tests.yml"

permissions:
  contents: write

concurrency:
  group: phase206-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase206:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Refresh branch source manifest
        if: github.event_name == 'push'
        run: |
          python scripts/generate_manifest.py --write BUILD_MANIFEST.sha256
          git add BUILD_MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(phase206): refresh source integrity manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --verify --strict
      - name: Run repository secret scan
        run: |
          python scripts/security/scan_secrets.py
          python scripts/security/scan_secrets.py --check-staged
      - name: Run secret scanner regression tests
        run: python -m pytest -q tests/test_secret_scan_phase0.py tests/test_secret_scan_phase193b.py
      - name: Run LIVE safety gate regressions
        run: python -m pytest -q tests/test_live_block_11.py tests/test_safety_guards_11a.py
      - name: Run testnet authorization capability regressions
        run: python -m pytest -q tests/test_phase193a_execution_safety_gate.py
      - name: Run Phase 206 focused tests
        run: python -m pytest -q tests/test_phase206_historical_capture_pipeline.py
      - name: Run Phase 207 durable resume tests
        run: python -m pytest -q tests/test_phase207_durable_capture_resume.py
      - name: Run Phase 199 and Phase 205 regressions
        run: python -m pytest -q tests/test_phase199_delta_reconciliation_read_adapter.py tests/test_phase205_cross_capture_reconciliation.py
