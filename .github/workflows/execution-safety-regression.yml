name: Execution Safety Regression

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches:
      - "audit/**"

permissions:
  contents: read

concurrency:
  group: execution-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-execution-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install pinned project and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run authorization and execution-safety regressions
        env:
          PYTHONHASHSEED: "0"
        run: >-
          python -m pytest
          tests/test_phase193a_execution_safety_gate.py
          tests/test_phase189_authorization_preflight.py
          -q

  full-repository-suite:
    needs: focused-execution-safety
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install pinned project and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run canonical full repository test suite
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest tests/ -q
