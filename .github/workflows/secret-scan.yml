name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject credential material in the working tree
        run: python scripts/security/scan_secrets.py
      - name: Reject credential material in staged blobs
        run: python scripts/security/scan_secrets.py --check-staged
      - name: Audit repository history for credential assignments
        run: python scripts/security/scan_secrets.py --check-history
