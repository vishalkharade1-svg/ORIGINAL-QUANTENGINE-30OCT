name: Stage 88-91 governance hardening

on:
  pull_request:
    branches: [main, production-hardening/stages-84-87]
    paths:
      - "core/governance/production_hardening_stages88_91.py"
      - "tests/test_production_hardening_stages88_91.py"
      - "docs/production_hardening_stages88_91.md"
      - "BUILD_MANIFEST.sha256"
      - ".github/workflows/stage88-91-hardening.yml"

permissions:
  contents: read

concurrency:
  group: stage88-91-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage88-91:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest==9.0.3
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --verify --strict
      - name: Compile Stage 88-91 module
        run: python -m py_compile core/governance/production_hardening_stages88_91.py
      - name: Stage 88-91 focused tests
        run: python -m pytest -q tests/test_production_hardening_stages88_91.py
