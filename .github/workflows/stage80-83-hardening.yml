name: Stage 80–83 governance hardening

on:
  pull_request:
    branches: [main, production-hardening/stages-76-79]
    paths:
      - "core/governance/production_hardening_stages80_83.py"
      - "tests/test_production_hardening_stages80_83.py"
      - "docs/production_hardening_stages80_83.md"
      - "BUILD_MANIFEST.sha256"
      - ".github/workflows/stage80-83-hardening.yml"

permissions:
  contents: read

concurrency:
  group: stage80-83-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage80-83:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest==9.0.3
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --verify --strict
      - name: Compile Stage 80–83 module
        run: python -m py_compile core/governance/production_hardening_stages80_83.py
      - name: Stage 80–83 focused tests
        run: python -m pytest -q tests/test_production_hardening_stages80_83.py
