name: Stage 84–87 governance hardening

on:
  pull_request:
    branches: [main, production-hardening/stages-80-83]
    paths:
      - "core/governance/production_hardening_stages84_87.py"
      - "tests/test_production_hardening_stages84_87.py"
      - "docs/production_hardening_stages84_87.md"
      - "BUILD_MANIFEST.sha256"
      - ".github/workflows/stage84-87-hardening.yml"

permissions:
  contents: read

concurrency:
  group: stage84-87-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage84-87:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest==9.0.3
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --verify --strict
      - name: Compile Stage 84–87 module
        run: python -m py_compile core/governance/production_hardening_stages84_87.py
      - name: Stage 84–87 focused tests
        run: python -m pytest -q tests/test_production_hardening_stages84_87.py
