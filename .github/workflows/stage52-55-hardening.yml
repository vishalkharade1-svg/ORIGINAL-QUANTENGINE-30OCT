name: Stage 52–55 production hardening controls

on:
  pull_request:
    branches: [main, production-hardening/stages-48-51]
    paths:
      - "core/governance/production_hardening_stages52_55.py"
      - "tests/test_production_hardening_stages52_55.py"
      - "docs/production_hardening_stages52_55.md"
      - "BUILD_MANIFEST.sha256"
      - ".github/workflows/stage52-55-hardening.yml"

permissions:
  contents: read

concurrency:
  group: stage52-55-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage52-55:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest==9.0.3
      - name: Report source hashes for manifest audit
        run: sha256sum core/governance/production_hardening_stages52_55.py tests/test_production_hardening_stages52_55.py docs/production_hardening_stages52_55.md .github/workflows/stage52-55-hardening.yml
      - name: Verify strict source manifest
        run: python scripts/generate_manifest.py --verify --strict
      - name: Compile Stage 52–55 module
        run: python -m py_compile core/governance/production_hardening_stages52_55.py
      - name: Stage 52–55 focused tests
        run: python -m pytest -q tests/test_production_hardening_stages52_55.py
